<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إهداء راقي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400&display=swap');

        body {
            margin: 0;
            padding: 0;
            /* خلفية متدرجة هادئة مستوحاة من الصورة */
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Tajawal', sans-serif;
            color: #e0e0e0;
        }

        .container {
            text-align: center;
            z-index: 2;
            position: relative;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Amiri', serif;
            font-size: 3.5rem;
            margin-bottom: 15px;
            /* نص بلون كريمي هادئ */
            color: #f0e6d2;
            text-shadow: 0 0 15px rgba(240, 230, 210, 0.4);
        }

        p {
            font-size: 1.6rem;
            font-weight: 300;
            margin-top: 0;
            opacity: 0.8;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
        }

        /* حاوية رسم SVG للورود */
        .flower-svg-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 30px auto;
        }

        /* أنماط لرسم SVG والرسوم المتحركة */
        .flower-stem {
            fill: none;
            stroke: #4a7c59; /* أخضر زمردي هادئ */
            stroke-width: 4;
            stroke-linecap: round;
        }

        .flower-leaf {
            fill: #5c946e; /* درجة أفتح من الأخضر */
        }

        .flower-petal {
            fill: #e8a87c; /* وردي خوخي ناعم */
        }

        .flower-center {
            fill: #f3d250; /* أصفر ذهبي هادئ */
        }

        /* رسوم متحركة للتمايل */
        @keyframes sway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        
        @keyframes leaf-wave {
            0%, 100% { transform: rotate(-5deg) translateY(0); }
            50% { transform: rotate(5deg) translateY(-2px); }
        }

        /* تطبيق الرسوم المتحركة */
        .swaying-flower {
            transform-origin: bottom center;
            animation: sway 5s ease-in-out infinite;
        }
        
        .waving-leaf {
             transform-origin: center;
             animation: leaf-wave 4s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>سوسو 🤍🌿</h1>
        <p>كلنا نروح فدوة لإيدچ 🫶🏻🍃</p>
    </div>

    <div class="flower-svg-container">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <g class="swaying-flower">
                <path class="flower-stem" d="M100 180 Q 105 140, 100 100" />
                <path class="flower-leaf waving-leaf" d="M100 140 Q 80 130, 75 115 Q 95 120, 100 140 Z" style="animation-delay: 0.5s;" />
                <path class="flower-leaf waving-leaf" d="M100 120 Q 120 110, 125 95 Q 105 100, 100 120 Z" style="animation-delay: 1s;" />

                <g transform="translate(100, 100)">
                    <circle class="flower-petal" cx="0" cy="-15" r="12" />
                    <circle class="flower-petal" cx="14" cy="-5" r="12" />
                    <circle class="flower-petal" cx="9" cy="12" r="12" />
                    <circle class="flower-petal" cx="-9" cy="12" r="12" />
                    <circle class="flower-petal" cx="-14" cy="-5" r="12" />
                    <circle class="flower-center" cx="0" cy="0" r="7" />
                </g>
            </g>
            
            <g class="swaying-flower" style="animation-duration: 6s; animation-delay: -2s;">
                <path class="flower-stem" d="M70 180 Q 75 150, 60 120" />
                <path class="flower-leaf waving-leaf" d="M65 150 Q 45 140, 40 125 Q 60 130, 65 150 Z" style="animation-delay: 0.8s;" />
                <g transform="translate(60, 120) scale(0.8)">
                    <circle class="flower-petal" cx="0" cy="-15" r="12" />
                    <circle class="flower-petal" cx="14" cy="-5" r="12" />
                    <circle class="flower-petal" cx="9" cy="12" r="12" />
                    <circle class="flower-petal" cx="-9" cy="12" r="12" />
                    <circle class="flower-petal" cx="-14" cy="-5" r="12" />
                    <circle class="flower-center" cx="0" cy="0" r="7" />
                </g>
            </g>

            <g class="swaying-flower" style="animation-duration: 5.5s; animation-delay: -1s;">
                <path class="flower-stem" d="M130 180 Q 125 150, 140 120" />
                <path class="flower-leaf waving-leaf" d="M135 150 Q 155 140, 160 125 Q 140 130, 135 150 Z" style="animation-delay: 0.3s;" />
                <g transform="translate(140, 120) scale(0.8)">
                    <circle class="flower-petal" cx="0" cy="-15" r="12" />
                    <circle class="flower-petal" cx="14" cy="-5" r="12" />
                    <circle class="flower-petal" cx="9" cy="12" r="12" />
                    <circle class="flower-petal" cx="-9" cy="12" r="12" />
                    <circle class="flower-petal" cx="-14" cy="-5" r="12" />
                    <circle class="flower-center" cx="0" cy="0" r="7" />
                </g>
            </g>
        </svg>
    </div>

</body>
</html>
